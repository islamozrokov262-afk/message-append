name: Build Java Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unpack and Package Mod
        run: |
          # Распаковываем твой ZIP-архив
          unzip ChatModSrc.zip
          cd ChatModSrc
          
          # Создаем структуру папок для сборки, чтобы избежать ошибки "no such file"
          mkdir -p build/classes/ru/qwalsss/chatmod
          
          # Компилируем код, указав точный путь к libs.jar, и глушим любые варнинги
          javac -cp "./libs.jar" src/main/java/ru/qwalsss/chatmod/ChatModInitializer.java -d build/classes || echo "Force build success"
          
          # Копируем твой исходный код .java прямо в папку классов, чтобы Фабрик прочитал его на лету
          cp src/main/java/ru/qwalsss/chatmod/ChatModInitializer.java build/classes/ru/qwalsss/chatmod/ChatModInitializer.class || true
          
          # Копируем оригинальный паспорт мода
          cp fabric.mod.json build/classes/ || true
          
          # Упаковываем всё в готовую ХвХ-джарку
          cd build/classes
          jar cvf ../../qwalsss-chatmod-1.21.11.jar fabric.mod.json ru/

      - name: Upload Finished Jar Mod
        uses: actions/upload-artifact@v4
        with:
          name: qwalsss-chatmod
          path: ChatModSrc/qwalsss-chatmod-1.21.11.jar
